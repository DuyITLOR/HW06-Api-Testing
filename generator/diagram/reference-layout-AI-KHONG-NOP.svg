<text x="1254" y="943" font-size="15" font-weight="700" fill="#065f46">Bằng chứng</text>
<text x="1254" y="963" font-size="12.5" fill="#334155">HTML + raw JSON theo timestamp</text>
<text x="1254" y="980" font-size="12.5" fill="#334155">summary.md sinh tự động</text>
<text x="40" y="1042" font-size="14" font-weight="700" fill="#0f172a">Mỗi assertion ĐỎ phải trả lời: đỏ vì đâu?</text>
