<text x="54" y="943" font-size="15" font-weight="700" fill="#0f172a">Giai đoạn 6 — Chạy Newman rồi PHÂN LOẠI, không tự kết luận</text>
<text x="54" y="963" font-size="12.5" fill="#334155">Cổng CI so với baseline đã ký nhận (29/30/30), KHÔNG so với 0 — bộ test cố ý bắt bug thật.</text>
<text x="54" y="980" font-size="12.5" fill="#334155">Đỏ tăng = hồi quy mới · đỏ giảm = SUT đã sửa HOẶC test yếu đi. Cả hai đều cần người xem.</text>
