<rect x="40" y="752" width="1600" height="42" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="54" y="777" font-size="15" font-weight="700" fill="#0f172a">Giai đoạn 5 — Sinh artefact từ MỘT nguồn định nghĩa (generator/specs/&lt;api&gt;.mjs)</text>
<rect x="40" y="808" width="385" height="74" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
